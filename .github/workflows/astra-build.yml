# Astra Launcher — one-click build.
# Put this file at .github/workflows/astra-build.yml in your fork of PrismLauncher,
# and put astra-launcher.patch in the repository root. Then: Actions → "Astra Build" → Run workflow.
# It takes the exact Prism commit the patch was made against, applies the Astra changes,
# builds with Prism's own CI steps and uploads the installers/zips as downloadable artifacts.

name: Astra Build

on:
  workflow_dispatch:
    inputs:
      build-type:
        description: Debug or Release
        type: choice
        options: [Release, Debug]
        default: Release

permissions: {}

jobs:
  build:
    name: Build (${{ matrix.artifact-name }})
    permissions:
      contents: read
      id-token: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact-name: Windows-MSVC
            cmake-preset: windows_msvc
            vcvars-arch: amd64
            qt-version: 6.11.2
          - os: ubuntu-24.04
            artifact-name: Linux
            cmake-preset: linux
            qt-version: 6.11.2

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    env:
      ARTIFACT_NAME: ${{ matrix.artifact-name }}-Qt6
      BUILD_PLATFORM: official
      BUILD_TYPE: ${{ inputs.build-type || 'Release' }}
      CMAKE_PRESET: ${{ matrix.cmake-preset }}

    steps:
      - name: Checkout Prism (base commit)
        uses: actions/checkout@v4
        with:
          repository: PrismLauncher/PrismLauncher
          ref: 7de6e963c258827971640ba8b41c95659a0ba962
          submodules: true
          fetch-depth: 1

      - name: Checkout this repo (for the patch)
        uses: actions/checkout@v4
        with:
          path: _astra
          sparse-checkout: astra-launcher.patch
          sparse-checkout-cone-mode: false

      - name: Apply Astra changes
        run: |
          git apply --binary --whitespace=nowarn _astra/astra-launcher.patch
          rm -rf _astra
          grep -q "Astra Launcher" program_info/CMakeLists.txt && echo "Astra patch applied"

      - name: Setup dependencies
        id: setup-dependencies
        uses: ./.github/actions/setup-dependencies
        with:
          build-type: ${{ env.BUILD_TYPE }}
          artifact-name: ${{ matrix.artifact-name }}
          vcvars-arch: ${{ matrix.vcvars-arch }}
          qt-version: ${{ matrix.qt-version }}

      - name: Configure
        env:
          ASTRA_MSA_CLIENT_ID: ${{ secrets.MSA_CLIENT_ID }}
          ASTRA_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          cmake --preset "$CMAKE_PRESET" -D VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET" -D VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -D Launcher_MSA_CLIENT_ID="$ASTRA_MSA_CLIENT_ID" -D Launcher_CURSEFORGE_API_KEY="$ASTRA_CURSEFORGE_API_KEY"

      - name: Build
        run: cmake --build --preset "$CMAKE_PRESET" --config "$BUILD_TYPE"

      - name: Short version
        id: short-version
        run: echo "version=astra-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/package/windows
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          # unsigned build (no code-signing account)
          azure-client-id: ''
          azure-tenant-id: ''
          azure-subscription-id: ''

      - name: Package (Linux)
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/package/linux
        with:
          version: ${{ steps.short-version.outputs.version }}
          build-type: ${{ steps.setup-dependencies.outputs.build-type }}
          artifact-name: ${{ matrix.artifact-name }}
          qt-version: ${{ steps.setup-dependencies.outputs.qt-version }}
